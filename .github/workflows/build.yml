
name: Build WaveTune APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "WaveTune-Android-Source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for P in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$P" ]; then
                SDK="$P"
                break
              fi
            done
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found on runner."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Found SDK: $SDK"

          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -n "$SM" ]; then
            echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"
            echo "Found sdkmanager: $SM"
          else
            echo "sdkmanager not found; checking installed SDK packages."
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [ -n "${SDKMANAGER:-}" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "platform-tools"
          else
            test -d "$ANDROID_HOME/platforms/android-35" || {
              echo "::error::Android SDK platform 35 is missing."
              exit 1
            }
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check source ZIP
        shell: bash
        run: |
          if [ ! -f "WaveTune-Android-Source.zip" ]; then
            echo "::error::WaveTune-Android-Source.zip is missing from repository root."
            exit 1
          fi

          unzip -t "WaveTune-Android-Source.zip"

      - name: Extract source and find project
        shell: bash
        run: |
          mkdir -p source
          unzip -q "WaveTune-Android-Source.zip" -d source

          SETTINGS="$(find source -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find source -type f -name settings.gradle -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in ZIP."
            find source -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveTune-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
