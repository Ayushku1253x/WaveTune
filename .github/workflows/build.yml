name: Build WaveTune APK

on:
workflow_dispatch:
push:
paths:
- “WaveTune-Android-Source.zip”
- “.github/workflows/build.yml”

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
  - name: Find Android SDK
    shell: bash
    run: |
      SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
      if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
        for P in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk; do
          if [ -d "$P" ]; then
            SDK="$P"
            break
          fi
        done
      fi
      if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
        echo "ERROR: Android SDK not found"
        exit 1
      fi
      echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
      if [ -z "$SDKMANAGER" ]; then
        echo "ERROR: sdkmanager not found"
        find "$SDK" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
        exit 1
      fi
      echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      echo "Found Android SDK: $SDK"
      echo "Found sdkmanager: $SDKMANAGER"
  - name: Install Android SDK packages
    shell: bash
    run: |
      yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
      "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "platform-tools"
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"
  - name: Check source ZIP
    run: |
      test -f WaveTune-Android-Source.zip
      unzip -l WaveTune-Android-Source.zip | head -n 30
  - name: Extract source
    run: |
      mkdir -p source
      unzip -q WaveTune-Android-Source.zip -d source
      if [ ! -f source/settings.gradle.kts ]; then
        echo "ERROR: settings.gradle.kts not found inside ZIP"
        find source -maxdepth 4 -type f | head -n 80
        exit 1
      fi
  - name: Build APK
    run: gradle -p source assembleDebug
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: WaveTune-debug-apk
      path: source/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
