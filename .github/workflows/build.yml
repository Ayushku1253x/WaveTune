name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Flutter APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Extract ZIP and Setup App
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        unzip "$ZIP_FILE" -d extracted_files/
        
        flutter create --org com.ayush.allinone all_in_one_tool
        
        if [ -f "extracted_files/pubspec.yaml" ]; then
          cp extracted_files/pubspec.yaml all_in_one_tool/
        fi
        if [ -d "extracted_files/lib" ]; then
          cp -r extracted_files/lib/* all_in_one_tool/lib/
        fi
        if [ -d "extracted_files/assets" ]; then
          cp -r extracted_files/assets all_in_one_tool/
        fi

        cd all_in_one_tool
        flutter pub get

    - name: Build APK and Rename
      run: |
        cd all_in_one_tool
        flutter build apk --release
        # APK को बाहर निकाल कर नया नाम दे रहे हैं ताकि कोई एरर न आए
        cp build/app/outputs/flutter-apk/app-release.apk ../Final-AllInOneTool.apk

    - name: Create Release and Upload
      uses: softprops/action-gh-release@v2
      with:
        files: Final-AllInOneTool.apk
        tag_name: v3.0.0-${{ github.run_number }}
        name: "All In One Tool v3.0 (Build ${{ github.run_number }})"
        body: "Automated release built successfully. Clean UI."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
